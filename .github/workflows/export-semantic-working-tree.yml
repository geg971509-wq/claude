name: Apply full semantic chunk renames

on:
  push:
    branches:
      - refactor/semantic-workshop-filenames

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load reviewed semantic audit mappings
        shell: bash
        run: |
          git fetch origin codex/semantic-chunk-audit-20260903
          git show origin/codex/semantic-chunk-audit-20260903:semantic-paths.json > /tmp/audit-semantic-paths.json
      - name: Apply semantic names to every physical chunk file
        run: python3 scripts/semantic-rename-all.py --audit /tmp/audit-semantic-paths.json --apply
      - name: Verify zero physical chunk filenames remain
        shell: bash
        run: |
          count="$(find bunfs -type f -name 'chunk-*.js' -print | wc -l | tr -d ' ')"
          echo "remaining physical chunk files: $count"
          test "$count" = "0"
      - name: Run semantic source validation
        run: node scripts/check-semantic-names.mjs
      - name: Record full migration status
        shell: bash
        run: |
          cat > SEMANTIC_RENAMES.md <<'EOF'
          # 全量 chunk 语义重命名

          本分支已对 `bunfs` 下所有物理文件名匹配 `chunk-*.js` 的 JavaScript 文件执行语义化迁移。

          命名证据按优先级使用：已有人工审计映射、模块语义导出别名、模块自身协议/API/错误/工具字符串、直接依赖与直接调用者语义，以及模块结构角色。虚拟 `/$bunfs/root/...` 标识保持不变，物理文件移动到 `bunfs/modules/<area>/<responsibility>.js`，`semantic-paths.json` 负责从原 Bun 虚拟路径映射到维护用物理路径。

          验收条件：

          - `find bunfs -type f -name 'chunk-*.js'` 返回 0 个文件。
          - `node scripts/check-semantic-names.mjs` 通过。
          - JavaScript 文件通过 `git mv` 移动，内容不因重命名而改写。

          `scripts/semantic-rename-all.py` 保留了可复现的全量分类和命名过程；对已有 `codex/semantic-chunk-audit-20260903` 高置信度人工审计映射，始终优先采用该映射。
          EOF
      - name: Commit full semantic migration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: rename all physical chunk files by responsibility"
          git push origin HEAD:refactor/semantic-workshop-filenames
