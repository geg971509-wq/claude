name: Export semantic working tree

on:
  push:
    branches:
      - refactor/semantic-workshop-filenames

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive working tree
        run: tar --exclude=.git -czf semantic-working-tree.tar.gz .
      - name: Upload working tree
        uses: actions/upload-artifact@v4
        with:
          name: semantic-working-tree
          path: semantic-working-tree.tar.gz
          retention-days: 1
